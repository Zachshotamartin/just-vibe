{
  "id": "tsx-json-parse-assertion",
  "language": "Tsx",
  "severity": "warning",
  "message": "A type assertion on JSON.parse output does not validate the data.",
  "note": "Narrow external data at runtime (a schema or type guard) before treating it as this type.",
  "metadata": {
    "pack": "typescript",
    "rule": 1
  },
  "rule": {
    "pattern": "JSON.parse($$$ARGS) as $TYPE"
  }
}
